[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-api-builder"
version = "2.0.0"
description = "Convention-based CRUD API and Schema builder for Flask, SQLAlchemy, and Marshmallow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BuyAutoParts" }]
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-marshmallow",
    "marshmallow",
    "marshmallow-sqlalchemy",
    "sqlalchemy",
    "werkzeug",
]

[project.optional-dependencies]
forms = ["wtforms-alchemy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_api_builder*"]
